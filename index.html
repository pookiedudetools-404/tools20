<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToolBox — Free Online Tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<style>
*{box-sizing:border-box}
:root{--bg:#f4f6fb;--panel:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#4f46e5;--input:#f9fafb;--shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05)}
html[data-theme="dark"]{--bg:#0b0d13;--panel:#141822;--text:#e6e9f0;--muted:#98a1b3;--border:#242a38;--accent:#818cf8;--input:#0f131c;--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);line-height:1.55;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;padding:13px 0}
.logo{font-weight:800;font-size:18px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--accent)}
.search{flex:1;max-width:460px}
.search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.search input:focus{border-color:var(--accent)}
.icon-btn{margin-left:auto;background:var(--panel);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:17px}
.hero{padding:34px 0 6px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px);letter-spacing:-.8px}
.hero p{margin:0;color:var(--muted);max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;padding:26px 0 60px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:17px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);text-align:left;color:inherit;font-family:inherit}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .ico{font-size:25px;display:block;line-height:1}
.card h3{margin:9px 0 4px;font-size:15px}
.card p{margin:0;font-size:12.5px;color:var(--muted)}
#toolView{padding:22px 0 70px;max-width:820px}
.back{background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;font-weight:700;padding:0;margin-bottom:14px;font-family:inherit}
.tool-title{margin:0 0 4px;font-size:24px}
.tool-body{margin-top:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:14px;font-family:inherit;outline:none}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input[type=color]{width:100%;height:44px;padding:3px;border-radius:10px;border:1px solid var(--border);background:var(--input);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
input[type=file]{width:100%;padding:11px;border-radius:10px;border:1px dashed var(--border);background:var(--input);color:var(--muted);font-size:13px;font-family:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.btn{padding:10px 15px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.checks{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:6px}
.checks label{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.out{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;white-space:pre-wrap;min-height:22px}
.out-list{display:flex;flex-direction:column;gap:9px}
.hash-row{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:10px 13px}
.hash-row b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.hash-row code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:6px}
.stat{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-v{display:block;font-size:21px;font-weight:800;word-break:break-word}
.stat-k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--muted)}.small{font-size:13px}
.msg{font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
.msg.ok{color:#16a34a}.msg.err{color:#dc2626}
.qr-box{display:flex;justify-content:center;align-items:center;margin-top:18px;min-height:40px}
.qr-box img,.qr-box canvas{max-width:100%;height:auto;border-radius:10px;background:#fff;padding:8px}
.meter{height:7px;border-radius:99px;background:var(--input);border:1px solid var(--border);overflow:hidden;margin-top:10px}
.meter div{height:100%;width:0;transition:.3s;background:#dc2626}
.preview{max-width:100%;border-radius:10px;border:1px solid var(--border);margin-top:12px;display:block}
.md-preview{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:16px 20px;min-height:120px;overflow-x:auto}
.md-preview h1,.md-preview h2,.md-preview h3{margin:.6em 0 .4em}
.md-preview code{background:var(--panel);padding:2px 6px;border-radius:5px;font-size:13px}
.md-preview pre{background:var(--panel);padding:12px;border-radius:8px;overflow-x:auto}
.md-preview pre code{background:none;padding:0}
.md-preview blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding-left:14px;color:var(--muted)}
.md-preview a{text-decoration:underline}
.md-preview hr{border:none;border-top:1px solid var(--border);margin:1em 0}
.pct-card{background:var(--input);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:12px}
.pct-card h4{margin:0 0 10px;font-size:14px}
.pct-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.pct-line input{width:90px;padding:8px 10px}
.pct-res{font-weight:800;color:var(--accent);font-size:17px}
.color-swatch{height:60px;border-radius:12px;border:1px solid var(--border);margin-top:10px}
footer{border-top:1px solid var(--border);padding:26px 0 40px;color:var(--muted);font-size:13px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:11px 22px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100}
#toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo" id="logo">🧰 Tool<span>Box</span></div>
    <div class="search"><input id="search" type="text" placeholder="Search tools… (qr, password, bmi, color)"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
  </div>
</header>
<main class="wrap">
  <div id="home">
    <div class="hero">
      <h1>Free tools that just work.</h1>
      <p>Everyday utilities for text, images, numbers and code — all running 100% in your browser. No sign-up, no tracking.</p>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="toolView" hidden></div>
</main>
<footer><div class="wrap">Built with ❤️ — all processing happens locally in your browser.</div></footer>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900);}
async function copy(text){if(!text){toast('Nothing to copy');return;}try{await navigator.clipboard.writeText(text);toast('Copied!');}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied!');}catch(_){toast('Copy failed');}ta.remove();}}
function downloadBlob(b,n){const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function randInt(m){if(m<=0)return 0;const a=new Uint32Array(1);const L=Math.floor(4294967296/m)*m;let x;do{crypto.getRandomValues(a);x=a[0];}while(x>=L);return x%m;}
function fmtBytes(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB';}
const timers=[];function clearTimers(){timers.forEach(clearInterval);timers.length=0;}

const tools=[
{id:'qr',icon:'🔳',name:'QR Code Generator',desc:'Turn any link or text into a scannable QR code and download it as PNG.',
html:`<div class="field"><label>Text or URL</label><textarea id="qrText" rows="3">https://github.com</textarea></div>
<div class="row">
<div class="field"><label>Size (px)</label><input id="qrSize" type="number" value="320" min="100" max="1200" step="20"></div>
<div class="field"><label>Foreground</label><input id="qrFg" type="color" value="#111827"></div>
<div class="field"><label>Background</label><input id="qrBg" type="color" value="#ffffff"></div>
</div>
<div class="btns"><button class="btn primary" id="qrGen">Generate QR</button><button class="btn" id="qrDl">⬇ Download PNG</button></div>
<div class="qr-box" id="qrBox"></div>`,
init(root){const box=$('#qrBox',root);
const gen=()=>{const text=$('#qrText',root).value.trim();if(!text){toast('Enter some text');return;}
if(typeof QRCode==='undefined'){box.innerHTML='<p class="muted small">QR library failed to load. Reload with internet.</p>';return;}
box.innerHTML='';const size=Math.max(100,Math.min(1200,parseInt($('#qrSize',root).value,10)||320));
try{new QRCode(box,{text,width:size,height:size,colorDark:$('#qrFg',root).value,colorLight:$('#qrBg',root).value,correctLevel:QRCode.CorrectLevel.H});}
catch(e){box.innerHTML='<p class="muted small">Text too long for a QR code.</p>';}};
$('#qrGen',root).onclick=gen;
$('#qrDl',root).onclick=()=>{const c=box.querySelector('canvas');if(!c){toast('Generate first');return;}c.toBlob(b=>downloadBlob(b,'qr-code.png'),'image/png');};
gen();}},

{id:'password',icon:'🔑',name:'Password Generator',desc:'Create strong random passwords and see how strong they are.',
html:`<div class="field"><label>Length: <b id="pwLenVal">16</b></label><input type="range" id="pwLen" min="4" max="64" value="16"></div>
<div class="checks">
<label><input type="checkbox" id="pwU" checked> Uppercase</label>
<label><input type="checkbox" id="pwL" checked> Lowercase</label>
<label><input type="checkbox" id="pwN" checked> Numbers</label>
<label><input type="checkbox" id="pwS" checked> Symbols</label>
<label><input type="checkbox" id="pwNA"> Avoid look-alikes</label>
</div>
<div class="btns"><button class="btn primary" id="pwGen">Generate</button><button class="btn" id="pwCopy">📋 Copy</button></div>
<div class="out" id="pwOut"></div>
<div class="meter"><div id="pwBar"></div></div>
<p class="muted small" id="pwStrength" style="margin-top:8px"></p>`,
init(root){const out=$('#pwOut',root),bar=$('#pwBar',root),str=$('#pwStrength',root),lenEl=$('#pwLen',root);
const build=()=>{let U='ABCDEFGHIJKLMNOPQRSTUVWXYZ',L='abcdefghijklmnopqrstuvwxyz',N='0123456789';const S='!@#$%^&*()-_=+[]{};:,.?/';
if($('#pwNA',root).checked){U=U.replace(/[OI]/g,'');L=L.replace(/[lo]/g,'');N=N.replace(/[01]/g,'');}
let pool='';if($('#pwU',root).checked)pool+=U;if($('#pwL',root).checked)pool+=L;if($('#pwN',root).checked)pool+=N;if($('#pwS',root).checked)pool+=S;
if(!pool){out.textContent='Select at least one type.';return;}
const len=+lenEl.value;let pw='';for(let i=0;i<len;i++)pw+=pool[randInt(pool.length)];out.textContent=pw;
const ent=len*Math.log2(pool.length);let pct,col,lbl;
if(ent<40){pct=30;col='#dc2626';lbl='Weak';}else if(ent<65){pct=60;col='#f59e0b';lbl='Good';}else if(ent<90){pct=82;col='#16a34a';lbl='Strong';}else{pct=100;col='#059669';lbl='Excellent';}
bar.style.width=pct+'%';bar.style.background=col;str.textContent=lbl+' — about '+Math.round(ent)+' bits of entropy.';};
lenEl.oninput=()=>{$('#pwLenVal',root).textContent=lenEl.value;build();};
$('#pwGen',root).onclick=build;$('#pwCopy',root).onclick=()=>copy(out.textContent);
$$('.checks input',root).forEach(c=>c.onchange=build);build();}},

{id:'wordcount',icon:'📝',name:'Word & Character Counter',desc:'Live counts of words, characters, sentences and reading time.',
html:`<div class="field"><label>Your text</label><textarea id="wcText" rows="9" placeholder="Start typing…"></textarea></div><div class="stats" id="wcStats"></div>`,
init(root){const ta=$('#wcText',root),out=$('#wcStats',root);
const upd=()=>{const t=ta.value;const words=t.trim()?t.trim().split(/\s+/).length:0;
const sentences=(t.match(/[^.!?…]+[.!?…]+/g)||[]).length;
const paras=t.split(/\n\s*\n/).filter(p=>p.trim()).length;
const rs=Math.round((words/200)*60);const rt=words===0?'0s':(rs<60?rs+'s':Math.round(rs/60)+' min');
const rows=[['Words',words],['Characters',t.length],['No spaces',t.replace(/\s/g,'').length],['Sentences',sentences],['Paragraphs',paras],['Reading time',rt]];
out.innerHTML=rows.map(r=>'<div class="stat"><span class="stat-v">'+r[1]+'</span><span class="stat-k">'+r[0]+'</span></div>').join('');};
ta.oninput=upd;upd();}},

{id:'case',icon:'🔠',name:'Case Converter',desc:'UPPERCASE, Title Case, camelCase, snake_case and more.',
html:`<div class="field"><label>Input</label><textarea id="csIn" rows="6"></textarea></div>
<div class="btns">
<button class="btn" data-c="upper">UPPERCASE</button><button class="btn" data-c="lower">lowercase</button>
<button class="btn" data-c="title">Title Case</button><button class="btn" data-c="sentence">Sentence case</button>
<button class="btn" data-c="camel">camelCase</button><button class="btn" data-c="pascal">PascalCase</button>
<button class="btn" data-c="snake">snake_case</button><button class="btn" data-c="kebab">kebab-case</button>
<button class="btn" data-c="constant">CONSTANT_CASE</button><button class="btn" data-c="alternate">aLtErNaTiNg</button>
<button class="btn" data-c="invert">iNVERT cASE</button><button class="btn" data-c="reverse">esreveR</button>
</div>
<div class="field"><label>Output</label><textarea id="csOut" rows="6" readonly></textarea></div>
<div class="btns"><button class="btn primary" id="csCopy">📋 Copy</button><button class="btn" id="csUse">↺ Use as input</button></div>`,
init(root){const i=$('#csIn',root),o=$('#csOut',root);
const W=s=>s.replace(/([a-z0-9])([A-Z])/g,'$1 $2').split(/[^A-Za-z0-9]+/).filter(Boolean);
const tr=(t,s)=>{const w=W(s);switch(t){
case 'upper':return s.toUpperCase();case 'lower':return s.toLowerCase();
case 'title':return s.replace(/\S+/g,x=>x.charAt(0).toUpperCase()+x.slice(1).toLowerCase());
case 'sentence':return s.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase());
case 'camel':return w.map((x,k)=>k===0?x.toLowerCase():x.charAt(0).toUpperCase()+x.slice(1).toLowerCase()).join('');
case 'pascal':return w.map(x=>x.charAt(0).toUpperCase()+x.slice(1).toLowerCase()).join('');
case 'snake':return w.map(x=>x.toLowerCase()).join('_');
case 'kebab':return w.map(x=>x.toLowerCase()).join('-');
case 'constant':return w.map(x=>x.toUpperCase()).join('_');
case 'alternate':return Array.from(s).map((c,k)=>k%2?c.toUpperCase():c.toLowerCase()).join('');
case 'invert':return Array.from(s).map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('');
case 'reverse':return Array.from(s).reverse().join('');default:return s;}};
$$('[data-c]',root).forEach(b=>b.onclick=()=>{o.value=tr(b.dataset.c,i.value);});
$('#csCopy',root).onclick=()=>copy(o.value);
$('#csUse',root).onclick=()=>{i.value=o.value;o.value='';};}},

{id:'base64',icon:'🔐',name:'Base64 Encode / Decode',desc:'Convert text to Base64 and back, including emoji.',
html:`<div class="field"><label>Input</label><textarea id="bIn" rows="6"></textarea></div>
<div class="btns"><button class="btn primary" id="bEnc">Encode →</button><button class="btn primary" id="bDec">← Decode</button><button class="btn" id="bCopy">📋 Copy</button><button class="btn" id="bSwap">⇅ Swap</button></div>
<div class="field"><label>Output</label><textarea id="bOut" rows="6" readonly></textarea></div><p class="msg" id="bMsg"></p>`,
init(root){const i=$('#bIn',root),o=$('#bOut',root),m=$('#bMsg',root);
const enc=s=>{const b=new TextEncoder().encode(s);let bin='';b.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin);};
const dec=s=>{const bin=atob(s.trim());const b=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(b);};
$('#bEnc',root).onclick=()=>{try{o.value=enc(i.value);m.textContent='Encoded ✓';m.className='msg ok';}catch(e){m.textContent='Error: '+e.message;m.className='msg err';}};
$('#bDec',root).onclick=()=>{try{o.value=dec(i.value);m.textContent='Decoded ✓';m.className='msg ok';}catch(e){m.textContent='Not valid Base64';m.className='msg err';}};
$('#bCopy',root).onclick=()=>copy(o.value);
$('#bSwap',root).onclick=()=>{const t=i.value;i.value=o.value;o.value=t;};}},

{id:'urlenc',icon:'🔗',name:'URL Encoder / Decoder',desc:'Escape or unescape special characters in URLs.',
html:`<div class="field"><label>Input</label><textarea id="uIn" rows="5"></textarea></div>
<div class="btns"><button class="btn primary" id="uEnc">Encode</button><button class="btn primary" id="uDec">Decode</button><button class="btn" id="uEncAll">Encode full URL</button><button class="btn" id="uCopy">📋 Copy</button></div>
<div class="field"><label>Output</label><textarea id="uOut" rows="5" readonly></textarea></div><p class="msg" id="uMsg"></p>`,
init(root){const i=$('#uIn',root),o=$('#uOut',root),m=$('#uMsg',root);
const safe=fn=>{try{o.value=fn(i.value);m.textContent='Done ✓';m.className='msg ok';}catch(e){m.textContent='Error: '+e.message;m.className='msg err';}};
$('#uEnc',root).onclick=()=>safe(v=>encodeURIComponent(v));
$('#uDec',root).onclick=()=>safe(v=>decodeURIComponent(v));
$('#uEncAll',root).onclick=()=>safe(v=>encodeURI(v));
$('#uCopy',root).onclick=()=>copy(o.value);}},

{id:'json',icon:'🧩',name:'JSON Formatter',desc:'Beautify, minify and validate JSON.',
html:`<div class="field"><label>JSON input</label><textarea id="jIn" rows="10" class="mono"></textarea></div>
<div class="btns"><button class="btn primary" id="jFmt">Pretty print</button><button class="btn" id="jMin">Minify</button><button class="btn" id="jCopy">📋 Copy</button><button class="btn" id="jClr">Clear</button></div>
<div class="field"><label>Output</label><textarea id="jOut" rows="10" class="mono" readonly></textarea></div><p class="msg" id="jMsg"></p>`,
init(root){const i=$('#jIn',root),o=$('#jOut',root),m=$('#jMsg',root);
const run=min=>{if(!i.value.trim()){m.textContent='Paste some JSON first.';m.className='msg err';return;}
try{const v=JSON.parse(i.value);o.value=min?JSON.stringify(v):JSON.stringify(v,null,2);m.textContent='Valid ✓';m.className='msg ok';}
catch(e){o.value='';m.textContent='Invalid → '+e.message;m.className='msg err';}};
$('#jFmt',root).onclick=()=>run(false);$('#jMin',root).onclick=()=>run(true);
$('#jCopy',root).onclick=()=>copy(o.value);
$('#jClr',root).onclick=()=>{i.value='';o.value='';m.textContent='';};}},

{id:'hash',icon:'#️⃣',name:'Hash Generator',desc:'SHA-1, SHA-256, SHA-384 and SHA-512 hashes from text or file.',
html:`<div class="field"><label>Text</label><textarea id="hText" rows="4">hello world</textarea></div>
<div class="btns"><button class="btn primary" id="hRun">Generate hashes</button></div>
<div class="out-list" id="hOut"></div>
<div class="field" style="margin-top:24px"><label>…or hash a file (never uploaded)</label><input type="file" id="hFile"></div>
<div class="out-list" id="hFileOut"></div>`,
init(root){const out=$('#hOut',root),fout=$('#hFileOut',root);
const algos=['SHA-1','SHA-256','SHA-384','SHA-512'];
const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');

{id:'units',icon:'📐',name:'Unit Converter',desc:'Length, weight, temperature, volume, speed, data and more.',

$('#ibCopy',root).onclick=()=>copy(out.value);
$('#ibCss',root).onclick=()=>copy('background-image: url("'+out.value+'");');
$('#ibHtml',root).onclick=()=>copy('<img src="'+out.value+'" alt="">');}},

{id:'textclean',icon:'🧹',name:'Text Cleaner & Sorter',desc:'Remove duplicates, blanks, sort and shuffle lines.',
html:`<div class="field"><label>Input lines</label><textarea id="tcIn" rows="8"></textarea></div>
<div class="checks">
<label><input type="checkbox" id="tcD" checked> Remove duplicates</label>
<label><input type="checkbox" id="tcE" checked> Remove empty lines</label>
<label><input type="checkbox" id="tcT" checked> Trim whitespace</label>
<label><input type="checkbox" id="tcCi"> Ignore case for duplicates</label>
</div>
<div class="btns">
<button class="btn primary" id="tcRun">Clean</button>
<button class="btn" data-s="az">Sort A→Z</button><button class="btn" data-s="za">Sort Z→A</button>
<button class="btn" data-s="len">By length</button><button class="btn" data-s="shuf">Shuffle</button>
<button class="btn" id="tcRev">Reverse</button><button class="btn" id="tcCopy">📋 Copy</button>
</div>
<div class="field"><label>Output</label><textarea id="tcOut" rows="8" readonly></textarea></div>`,
init(root){const inp=$('#tcIn',root),out=$('#tcOut',root);
const clean=()=>{let l=inp.value.split('\n');
if($('#tcT',root).checked)l=l.map(x=>x.trim());
if($('#tcE',root).checked)l=l.filter(x=>x.length);
if($('#tcD',root).checked){const s=new Set(),ci=$('#tcCi',root).checked;
l=l.filter(x=>{const k=ci?x.toLowerCase():x;if(s.has(k))return false;s.add(k);return true;});}
out.value=l.join('\n');};
$('#tcRun',root).onclick=clean;$('#tcCopy',root).onclick=()=>copy(out.value);
$('#tcRev',root).onclick=()=>{out.value=out.value.split('\n').reverse().join('\n');};
$$('[data-s]',root).forEach(b=>b.onclick=()=>{if(!out.value)clean();
let l=out.value.split('\n');const s=b.dataset.s;
if(s==='az')l.sort((a,b2)=>a.localeCompare(b2));
if(s==='za')l.sort((a,b2)=>b2.localeCompare(a));
if(s==='len')l.sort((a,b2)=>a.length-b2.length);
if(s==='shuf'){for(let i=l.length-1;i>0;i--){const j=randInt(i+1);const t=l[i];l[i]=l[j];l[j]=t;}}
out.value=l.join('\n');});}},

{id:'markdown',icon:'📖',name:'Markdown Preview',desc:'Write Markdown, see the formatted result instantly.',
html:`<div class="field"><label>Markdown</label><textarea id="mdIn" rows="12" class="mono"># Hello world

This is **bold**, this is *italic*, and this is \`inline code\`.

- Point one
- Point two

> A blockquote looks like this.

[Visit GitHub](https://github.com)</textarea></div>
<div class="btns"><button class="btn primary" id="mdCopy">📋 Copy Markdown</button><button class="btn" id="mdHtml">📋 Copy HTML</button></div>
<div class="field"><label>Preview</label><div class="md-preview" id="mdOut"></div></div>`,
init(root){const inp=$('#mdIn',root),out=$('#mdOut',root);
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>')
.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
.replace(/\*([^*]+)\*/g,'<em>$1</em>')
.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
const mdToHtml=src=>{const lines=esc(src).split('\n');const res=[];let inCode=false,listType=null;
const closeList=()=>{if(listType){res.push(listType==='ul'?'</ul>':'</ol>');listType=null;}};
for(const raw of lines){
if(/^```/.test(raw)){if(inCode){res.push('</code></pre>');inCode=false;}else{closeList();res.push('<pre><code>');inCode=true;}continue;}
if(inCode){res.push(raw);continue;}
const line=raw;
if(!line.trim()){closeList();continue;}
const h=line.match(/^(#{1,6})\s+(.*)$/);
if(h){closeList();res.push('<h'+h[1].length+'>'+inl(h[2])+'</h'+h[1].length+'>');continue;}
if(/^---+$/.test(line.trim())){closeList();res.push('<hr>');continue;}
const bq=line.match(/^>\s?(.*)$/);
if(bq){closeList();res.push('<blockquote>'+inl(bq[1])+'</blockquote>');continue;}
const ul=line.match(/^[-*+]\s+(.*)$/);
if(ul){if(listType!=='ul'){closeList();res.push('<ul>');listType='ul';}res.push('<li>'+inl(ul[1])+'</li>');continue;}
const ol=line.match(/^\d+\.\s+(.*)$/);
if(ol){if(listType!=='ol'){closeList();res.push('<ol>');listType='ol';}res.push('<li>'+inl(ol[1])+'</li>');continue;}
closeList();res.push('<p>'+inl(line)+'</p>');}
closeList();if(inCode)res.push('</code></pre>');return res.join('\n');};
const update=()=>{out.innerHTML=mdToHtml(inp.value);};
inp.oninput=update;
$('#mdCopy',root).onclick=()=>copy(inp.value);
$('#mdHtml',root).onclick=()=>copy(out.innerHTML);
update();}}

/* ============ RENDER LOGIC ============ */
const grid=$('#grid');
function renderGrid(filter){
  const f=(filter||'').toLowerCase();
  grid.innerHTML='';
  const list=tools.filter(t=>!f||t.name.toLowerCase().includes(f)||t.desc.toLowerCase().includes(f));
  if(!list.length){grid.innerHTML='<p class="muted" style="grid-column:1/-1;text-align:center;padding:30px">No tools match your search.</p>';return;}
  list.forEach(t=>{
    const b=document.createElement('button');
    b.className='card';
    b.innerHTML='<span class="ico">'+t.icon+'</span><h3>'+t.name+'</h3><p>'+t.desc+'</p>';
    b.onclick=()=>openTool(t);
    grid.appendChild(b);
  });
}

function openTool(t){
  clearTimers();
  $('#home').hidden=true;
  const view=$('#toolView');
  view.hidden=false;
  view.innerHTML='<button class="back" id="backBtn">← Back to all tools</button>'+
    '<h2 class="tool-title">'+t.icon+' '+t.name+'</h2>'+
    '<p class="muted">'+t.desc+'</p>'+
    '<div class="tool-body" id="toolBody">'+t.html+'</div>';
  $('#backBtn').onclick=()=>{
    clearTimers();
    view.hidden=true;view.innerHTML='';$('#home').hidden=false;window.scrollTo(0,0);
  };
  try{t.init($('#toolBody'));}catch(e){console.error('Tool error:',e);}
  window.scrollTo(0,0);
}

$('#search').oninput=e=>renderGrid(e.target.value);
$('#logo').onclick=()=>{if(!$('#home').hidden)return;$('#backBtn')&&$('#backBtn').click();};

/* Theme */
const themeBtn=$('#themeBtn');
const saved=localStorage.getItem('theme');
if(saved)document.documentElement.dataset.theme=saved;
const syncIcon=()=>{themeBtn.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';};
syncIcon();
themeBtn.onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';
document.documentElement.dataset.theme=n;localStorage.setItem('theme',n);syncIcon();};

renderGrid();
</script>
